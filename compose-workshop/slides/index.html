## 1 · The stack as a file | Why Compose

The `docker run` for our little API is already unbearable:

```sm
docker network create demo
docker run -d --name db --network demo -e POSTGRES_USER=… -e POSTGRES_PASSWORD=… \
  -v pgdata:/var/lib/postgresql/data postgres:16-alpine
docker run -d --name api --network demo -p 8000:8000 -e DATABASE_URL=… \
  -v ./app:/code/app notes:v2.1 uvicorn … --reload
```

- Compose puts the whole stack in one declarative file: `compose.yaml`
- One command up, one command down; networks created automatically
- The file is **committed** — the dev environment becomes code-reviewed and onboarding becomes `git clone && docker compose up`

---
## 1 · The stack as a file | Where Compose sits

:::cols
:::card !good Compose is
- one machine, one Docker daemon
- a **file** that describes services, and a CLI that makes the containers match it
- the right tool for **dev environments, CI, and a single VM** — most teams' real footprint
:::
|||
:::card !warm Compose is not
- a cluster: no scheduling across machines, no self-healing when a node dies
- rolling updates, autoscaling, load balancing between replicas
- that is Kubernetes (or Swarm) territory — same *ideas*, much more machinery
:::
:::

- A loose vocabulary bridge, **not** an equivalence: a Compose *service* is roughly what Kubernetes splits into a Deployment and a Service; a *healthcheck* is where the readiness-probe habit starts; a *named volume* is a first taste of storage outside the container; `.env` is client-side templating — Kubernetes moves that into ConfigMaps and Secrets
- What transfers is the thinking: services, health, config from outside, state outside the container. The file format does not

---
## 1 · The stack as a file | What `up` actually does

`docker compose up` is a **reconcile**, not a script: compare the file with what exists, fix the difference.

| step | what happens | you see |
|---|---|---|
| 1 | the project network and named volumes are created if missing | `Network demo_default Created` |
| 2 | images: build the services that have `build:` (cache permitting), pull the rest | `Image notes:compose Built` |
| 3 | containers are **created** — or **recreated** if their config changed since last time | `Container demo-api-1 Recreated` |
| 4 | started in dependency order, each gate honoured: started · healthy · completed | `db Healthy` → `migrate Exited` → `api Started` |
| 5 | foreground: attach to every log; `-d`: return; `--wait`: block until all gates are green | interleaved, prefixed logs |

~ Unchanged services are left alone — that is why `up` is safe to run again and again, and why `restart` is rarely what you want.

## 1 · The stack as a file | compose.yaml, annotated

```sm
services:
  [[api]]:
    build: .                          # build from our Dockerfile…
    image: notes:compose              # …and call the result this
    ports: ["${API_PORT:-8000}:8000"] # publish to host (from .env, or 8000)
    environment:
      DATABASE_URL: postgresql://workshop:workshop@[[db]]:5432/notes
    depends_on: { migrate: { condition: [[service_completed_successfully]] } }
  [[migrate]]:
    image: notes:compose              # same image, different command, exits when done
    command: python -m app.migrate
    depends_on: { db: { condition: [[service_healthy]] } }
  [[db]]:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: workshop, POSTGRES_PASSWORD: workshop, POSTGRES_DB: notes }
    volumes: [pgdata:/var/lib/postgresql/data]   # named volume → state survives
volumes:
  pgdata:
```

- Three **services**, two images: `api` and `migrate` share one build (`build:` + `image:` = build it, name it), `db` is pulled. Compose is just `docker run` flags, versioned in a file
- Top-level `volumes:` *declares* the named volume; the line under `db` *mounts* it

~ Merged view, without dev extras or healthchecks — section 2 takes it apart, section 3 adds the override.

## 2 · The building blocks | Networks: what Compose adds

Part 1: containers on one network reach each other by name. Compose decides **which networks exist and who is on them** — and that decides who can talk.

```sm
services:
  proxy:
    networks: [frontend]
    ports: ["80:80"]
  api:
    networks: [frontend, backend]
  db:
    networks: [backend]          # unreachable from anything that isn't on "backend"
networks:
  frontend:
  backend:
```

- No `networks:` anywhere → every service joins the project's `default` network. Fine for most stacks; split when something must **not** reach the database
- Isolation is **membership**, nothing else: `expose:` is documentation, `ports:` is a hole to the host
- Extra names: `networks: { backend: { aliases: [postgres] } }`. Reach your laptop from a container: `host.docker.internal` (Docker Desktop; on Linux add `extra_hosts: ["host.docker.internal:host-gateway"]`)
- `--scale api=2` with a fixed `"8000:8000"` collides on the host — publish `"8000"` alone for a random host port per replica; `docker compose port --index=1 api 8000` tells you which (repeat per index)

## 2 · The building blocks | Volumes: what Compose adds

| kind | what Compose gives you | watch out |
|---|---|---|
| named `pgdata:` | declared at top level, created on `up`, prefixed `demo_pgdata`, **survives `down`** | `down -v` deletes it — the reset button and the footgun |
| bind `./app:/code/app` | relative to the compose file, not to your shell | on Linux the container writes as its UID — root-owned files in your repo |
| anonymous (`VOLUME` in an image, or `- /data`) | kept when `up` recreates the container — but nothing reattaches it after `down` | silent data loss on the next `up`: state you thought was kept, wasn't. Name it |
| `external: true` | reuse a volume Compose didn't create — shared between projects, or precious | `down -v` never touches it; you create and delete it yourself |

~ `docker compose config` shows the resolved names, `docker volume ls` the reality. Remove volumes by name — never a blanket `volume prune` on a machine with other projects.

## 2 · The building blocks | Healthcheck anatomy

```sm
healthcheck:
  test: ["CMD-SHELL", "pg_isready -U workshop -d notes"]   # exit 0 = healthy. runs INSIDE the container
  interval: 2s        # how often
  timeout: 2s         # a hanging check counts as a failure
  retries: 15         # consecutive failures before "unhealthy"
  start_period: 10s   # grace: failures in here don't count, a success ends it early
```

```sm
create ─── (starting) ─── start_period ───▶ [[healthy]] ───── retries × interval of failures ─────▶ [[unhealthy]]
             failures ignored                              still running! only ps, inspect, depends_on and --wait notice
```

- Whatever the check calls must exist in the image: `pg_isready` in postgres, `python` in ours — there is no `curl` in slim
- `docker compose ps` shows the state; `docker inspect -f '{{json .State.Health}}' demo-db-1` shows the last outputs — read them when a check never goes green
- Unhealthy does **not** restart anything by itself. It is a signal — for `depends_on`, `--wait`, `ps`, and for you

---
## 2 · The building blocks | depends_on: three conditions

| condition | waits until | use it for |
|---|---|---|
| service_started | the container is running | a dependency with no warm-up — rare |
| service_healthy | its healthcheck passed | databases, brokers, anything that boots slower than it starts |
| service_completed_successfully | it **exited with 0** | one-shot jobs: schema migrations, seeders, asset builds |

- Plain `depends_on: [db]` is the first row — Postgres the *process* starts before Postgres *accepts connections*. The API boots, connects, crashes. Works-on-a-fast-laptop flavor
- Our stack: `db` healthy → `migrate` runs and exits → `api` starts. Schema changes are a **job**, not app startup — and the job is idempotent, because `up` runs it every time
- The gates are for **startup only** — if db dies later, nothing tells the api. Reconnect in the app; a `restart:` policy only helps if the process exits
- Scripting: `up -d --wait` blocks until every gate is satisfied — or fails

## 2 · The building blocks | build: inside Compose

:::cols
```sm
# Dockerfile — named stages
FROM python:3.12-slim AS base
  …deps (no dev group), code, CMD
FROM base AS dev
  RUN uv sync           # + pytest, httpx
  COPY tests/ tests/
FROM base AS runtime    # last = default
```
|||
```sm
# compose.yaml                 # compose.override.yaml (dev)
services:                      services:
  api:                           api:
    build: .                       build:
    image: notes:compose             target: dev
  migrate:
    image: notes:compose         # compose.ci.yaml: the same 3 lines
```
:::

- One Dockerfile, several **targets** — the multi-stage trick from Part 1, now chosen per environment by whichever file loads: dev and CI get `dev` (pytest, the tests), a plain `-f compose.yaml` builds the lean `runtime`
- `build:` + `image:` names the result so other services can reuse it (`migrate`) — Compose builds before it creates any container
- `build.args:` for build-time knobs; `up --build` after Dockerfile changes, or `develop.watch` rules to rebuild when the lockfile changes
- The cache is still yours: the layer order from Part 1 decides whether `--build` takes one second or sixty

## 2 · The building blocks | Jobs, networks, and a deliberate crash
@demo LIVE DEMO 2 · GATES & NETWORKS

```sm
$ docker compose ps -a                 # migrate: Exited (0) — the job that ran before api
$ docker compose run --rm migrate      # run it again by hand: idempotent — "schema is up to date"
$ docker compose run --rm api pytest   # one-off container, same network, same env — the tests hit the real db
$ docker run --rm alpine getent hosts db                          # not on the project network: nothing
$ docker run --rm --network demo_default alpine getent hosts db   # membership is the whole story

# break it: a slow database and no health gate (compose.race.yaml — opt-in only)
$ docker compose down -v
$ docker compose -f compose.yaml -f compose.override.yaml -f compose.race.yaml up
# api: "connection refused" → "Application startup failed". ps still says Up — until the healthcheck disagrees
```

~ Watch for: `run --rm` inheriting everything · the DNS lookup that finds nothing · a container that is Up and useless.

## 3 · Team patterns | Config: the .env file

```sm
# .env — NOT committed (.gitignore it; commit a .env.example instead)
POSTGRES_PASSWORD=s3cret
API_PORT=8001
# compose.yaml — committed, no values inside
services:
  api:
    ports: ["[[${API_PORT:-8000}]]:8000"]                   # fallback when unset
    environment:
      DATABASE_URL: postgresql://workshop:[[${POSTGRES_PASSWORD:?set it in .env}]]@db:5432/notes   # refuse to start without it
```

- Compose reads `.env` next to the compose file **automatically** and fills `${VAR}` while loading, before merging. `${VAR:-default}` = fallback, `${VAR:?msg}` = fail loudly
- Precedence: your shell beats `.env`. Inside a service, `environment:` beats `env_file:`
- `.env` never enters a container by itself — `${VAR}` fills the *file*; `env_file: app.env` hands a whole file to the *container*. Different mechanisms
- Debugging: `docker compose config` prints the resolved file, `config --environment` the variables it used

> Two gotchas
> `.env` is local config, not a vault — values show in `config` and `docker inspect`; real secrets want Compose `secrets:`. And Postgres reads `POSTGRES_*` only into an **empty** volume: change the password and auth fails until `down -v`.

## 3 · Team patterns | Compose, daily driver commands

| command | what |
|---|---|
| docker compose up -d --build | start in background; `--build` after Dockerfile changes, `--wait` to block until healthy |
| docker compose ps -a | stack status + health; `-a` includes exited containers (jobs!) |
| docker compose logs -f api | follow one service's logs |
| docker compose exec api bash | shell into a **running** service |
| docker compose run --rm api … | one-off container on the stack's network: migrations, tests, scripts |
| docker compose down | stop & remove containers and networks (volumes survive) |
| docker compose down -v | …and delete the project's volumes — the “reset my database” move |
| docker compose config | print the final resolved file (env substituted, overrides merged) |
| docker compose up --watch | rebuild/sync per the `develop.watch` rules in the file, e.g. rebuild when `pyproject.toml` changes |

~ Terminology: `docker compose` (the plugin — v2 onwards, v5 today) is the tool; the standalone `docker-compose` binary is v1, retired. `compose.yaml` is the preferred filename (`docker-compose.yml` still works) and the `version:` line at the top is obsolete — delete it.

## 3 · Team patterns | Lifecycle gotchas

- `Ctrl+C` on a foreground `up` **stops** the containers, it doesn't remove them — `ps -a` shows them, `down` cleans up
- `up -d` again **recreates only what changed** in the file; `restart` reuses the old container — an edited `environment:` needs `up`, not `restart`
- Dockerfile changed? `up --build`. New image tag in the file? `pull`, then `up`
- `--wait` is the scripting form: `up -d --wait` returns when every gate is green — or fails
- `down` removes what **this project** created: its containers, its network, and with `-v` its declared volumes. Never someone else's

> Rule of thumb
> Not sure what state you're in? `docker compose ps -a`, then `docker compose config`. One shows what *is* running, the other what *would*.

## 3 · Team patterns | The override file
@eyebrow 3 · Team patterns · deep dive

`docker compose up` automatically merges `compose.yaml` with `compose.override.yaml` when one exists. Base file = the contract; override = dev conveniences:

:::cols
```sm
# compose.yaml — committed, prod-shaped
services:
  api:
    build: .
    image: notes:compose
    ports: ["${API_PORT:-8000}:8000"]
    environment:
      DATABASE_URL: …
    depends_on:
      migrate: { condition: service_completed_successfully }
```
|||
```sm
# compose.override.yaml — dev-only extras
services:
  api:
    build: { target: dev }    # the stage with pytest
    volumes:
      - ./app:/code/app       # live reload…
    command: uvicorn app.main:app
             --reload --host 0.0.0.0
  adminer:                    # extra service,
    image: adminer            # opt-in via profile
    profiles: ["tools"]
    ports: ["127.0.0.1:8080:8080"]
```
:::

- Merge rules: **maps merge, lists append, scalars replace** — `build:` gains a `target`, `volumes:` gains a mount, `command:` is replaced whole. Keyed lists (`ports`, `volumes`) merge on their target, so an override can *change* a mount, not just add one
- `profiles:` makes a service opt-in: `docker compose --profile tools up` — skipped otherwise (and `down` needs the profile too)
- Explicit stacks skip the magic: `docker compose -f compose.yaml -f compose.ci.yaml up` merges left → right, ignores the override file, and resolves relative paths from the **first** file. `config` shows the merged truth either way

## 3 · Team patterns | Compose in CI

Same contract, no override, one three-line file for the CI-only difference:

```
$ docker compose -f compose.yaml -f compose.ci.yaml up -d --build --wait   # green, or fail fast
$ docker compose -f compose.yaml -f compose.ci.yaml run --rm api pytest    # one-off container, same network, dev image
$ docker compose -f compose.yaml -f compose.ci.yaml logs api               # on failure: the evidence
$ docker compose -f compose.yaml -f compose.ci.yaml down -v                # always — even when tests fail
```

- `compose.ci.yaml` says only `build: { target: dev }`. The base contract is untouched, the dev override never loads — explicit `-f` sees to that
- `--wait` turns healthchecks into the readiness signal, and the `migrate` gate means tests never race the schema
- `run --rm` gets the stack's network and env for free. When the command grows, a dedicated `tests` service is the next step
- `COMPOSE_FILE=compose.yaml:compose.ci.yaml` once, instead of repeating the flags

~ The repo runs exactly this: `demo/compose.ci.yaml`, `demo/tests/test_api.py`.

## 3 · Team patterns | Override, .env, profiles, data
@demo LIVE DEMO 3 · TEAM PATTERNS

```sm
$ diff <(docker compose -f compose.yaml config) <(docker compose config)   # exactly what the override adds
$ docker compose -p review config | grep 'name:'    # project naming — nothing started
$ cp .env.example .env                              # a real .env — set API_PORT=8001 in it
$ docker compose config | grep published            # "8001" — substituted from the file, no flags
$ docker compose up -d --wait                       # only api is Recreated: only its config changed
$ curl localhost:8001/notes; rm .env; docker compose up -d --wait          # …and back to 8000
$ docker compose --profile tools up -d --wait       # adminer joins → localhost:8080, browse the notes table

# data outlives the containers:
$ docker compose --profile tools down; docker compose ps -a         # gone (profile again, or adminer stays)
$ docker compose up -d --wait; curl localhost:8000/notes            # still there — demo_pgdata survived
$ docker compose down -v; docker compose up -d --wait; curl localhost:8000/notes   # [] — the reset button
```

~ Watch for: the reload you saw in demo 1 came from the override — the committed base has none of it · `Recreated` only for the service whose config changed · `down -v` as the actual database reset.

## 4 · Debugging & ops | Debugging a stack

| command | question it answers |
|---|---|
| docker compose ps -a | who's up, who's healthy, who **exited** — and with what code |
| docker compose logs -f --since 10m api | what it said — one service, or all of them interleaved |
| docker compose config | what Compose *thinks* the stack is: env substituted, overrides merged |
| docker compose exec api sh | look around inside a running service |
| docker compose run --rm --no-deps api sh | won't even start? same image and config, your command, no dependencies |
| docker inspect -f '{{json .State.Health}}' demo-db-1 | why a healthcheck never goes green: its last outputs |
| docker compose events | the daemon's feed for this project: health_status, die, start |
| docker compose top · stats | processes and live CPU/memory, per service |

~ Order: `ps -a` → `logs` → `config` → `exec`/`inspect`. Most Compose problems are in the file, not in the container.

---
## 4 · Debugging & ops | Failure bestiary, Compose edition

:::cols
:::card !bad dependency failed to start · didn't complete successfully
A gate stayed shut: a healthcheck never passed, or a job exited non-zero. `ps -a` for the culprit, `logs <that service>` for the reason. The dependent stays *Created* — on purpose.
:::
:::card !bad port is already allocated
Another project publishes the same host port: `docker ps --format '{{.Names}} {{.Ports}}'`. Fix: `API_PORT=…` in `.env`, or stop the other stack.
:::
:::card !bad Found orphan containers for this project
You renamed or removed a service; its old container is still around. `up --remove-orphans` or `down --remove-orphans`.
:::
|||
:::card !bad works after down -v, breaks after plain down
Stale state in a volume: a Postgres password changed in `.env`, a migration that assumed empty. Init variables only apply to an **empty** volume.
:::
:::card !bad my change isn't there
Dockerfile changed but no `--build`; env changed but you ran `restart`; or you're in a folder with a different project. `config` shows what would run, `ps` what does.
:::
:::card !bad network demo_default not found
Something still references a network that `down` removed — usually a stray `docker run --network` or a `run --rm` container that never got removed. `docker compose up` recreates it.
:::
:::

## 4 · Debugging & ops | Shutdown, restarts, limits

:::cols
### Stopping cleanly
- `stop` and `down` send **SIGTERM**, wait `stop_grace_period` (10 s), then SIGKILL — the reason `down` sometimes takes ten seconds: your process ignored the signal
- PID 1 must handle signals (Part 1). Shell wrappers and some runtimes don't: `init: true` puts a tiny init in front
- `restart: unless-stopped` for things that should come back after a crash or a reboot. Dev stacks usually leave it off, so failures stay visible
|||
### Limits
```sm
services:
  api:
    cpus: 1.5
    mem_limit: 512m
    pids_limit: 200
```
- The same knobs as `docker run --memory --cpus`, now versioned. `docker compose stats` shows what is enforced
- `deploy.resources.limits` is the spec's spelling and Compose honours it too; the flat keys are the unambiguous ones on a laptop
:::

---
## 4 · Debugging & ops | Break it, then find it
@demo LIVE DEMO 4 · STATUS → LOGS → CONFIG

```sm
# sabotage: a wrong password, the way it happens for real — a stray value in someone's shell
$ POSTGRES_PASSWORD=wrong docker compose up -d
#   service "migrate" didn't complete successfully: exit 1      ← the gate did its job
$ docker compose ps -a          # migrate Exited (1); api Created — never started, on purpose
$ docker compose logs migrate   # "password authentication failed" — there it is
$ POSTGRES_PASSWORD=wrong docker compose config | grep DATABASE_URL   # what it really ran with — same shell env as the up!
$ docker compose events --since 3m --until 1s | grep -E 'health_status|die'   # the daemon's view, bounded
# fix = fix the config: plain up recreates what changed, and only that
$ docker compose up -d --wait && docker compose ps
```

~ Same playbook, one level up: **status → logs → config → exec/inspect**. Note that `db` was recreated too (its env changed) but the volume kept the old password — which is exactly why auth failed.

---
## | What you take home
@eyebrow Recap

:::cols
:::card <span class="accent">1</span> · The stack as a file
`compose.yaml` **is** the dev environment — committed, reviewed, reproducible. `up` reconciles: it creates, recreates, and starts in gate order. Compose is one machine; the *ideas* scale to Kubernetes, the file doesn't.
:::
|||
:::card <span class="accent">2</span> · The building blocks
Isolation is network **membership**. State lives in **named** volumes. A healthcheck is a signal, not a restart. Three gates: started, **healthy**, **completed** — migrations are a job. One Dockerfile, targets per environment.
:::
:::
:::cols
:::card <span class="accent">3</span> · Team patterns
Local config in `.env`, dev extras in `compose.override.yaml`, optional tools behind `profiles:`, CI on the bare contract with `--wait`. `up` recreates, `restart` doesn't; `down -v` resets.
:::
|||
:::card <span class="accent">4</span> · Debugging & ops
`ps -a` → `logs` → `config` → `exec`. Gates make failures loud and early. Volumes remember what containers forget.
:::
:::

> If you remember one thing
> Onboarding should be `git clone && docker compose up` — everything else about the dev environment belongs in reviewed files, not in shell history.

<script>
(function () {
  'use strict';

  function esc(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function inline(s) {
    var codes = [];
    s = s.replace(/`([^`]+)`/g, function (m, c) {
      codes.push('<code>' + esc(c) + '</code>');
      return '\u0000' + (codes.length - 1) + '\u0000';
    });
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/\*([^*]+)\*/g, '<em>$1</em>');
    return s.replace(/\u0000(\d+)\u0000/g, function (m, i) { return codes[+i]; });
  }

  function renderTerm(lines, cls) {
    var html = lines.map(function (l) {
      var e = esc(l);
      e = e.replace(/\[\[(.+?)\]\]/g, '<span class="hl">$1</span>');
      e = e.replace(/(^|\s)(#.*)$/, function (m, sp, c) { return sp + '<span class="c">' + c + '</span>'; });
      e = e.replace(/^\$(\s)/, '<span class="p">$$</span>$1');
      return e;
    }).join('\n');
    return '<div class="term' + (cls ? ' ' + cls : '') + '"><pre>' + html + '</pre></div>';
  }

  // collect lines of a ::: block (lines[i] is the opener); returns [buf, nextIndex]
  function collect(lines, i) {
    var buf = [], depth = 1;
    i++;
    while (i < lines.length && depth > 0) {
      var t = lines[i];
      if (/^:::\S/.test(t)) depth++;
      else if (t.trim() === ':::') { depth--; if (depth === 0) { i++; break; } }
      buf.push(t);
      i++;
    }
    return [buf, i];
  }

  function splitCols(buf) {
    var cols = [[]], depth = 0;
    buf.forEach(function (t) {
      if (/^:::\S/.test(t)) depth++;
      else if (t.trim() === ':::') depth--;
      if (t.trim() === '|||' && depth === 0) cols.push([]);
      else cols[cols.length - 1].push(t);
    });
    return cols;
  }

  function renderTable(rows) {
    var html = '<div class="table-wrap"><table>';
    var isSep = function (r) { return /^\|[\s\-:|]+\|?\s*$/.test(r); };
    var hasHeader = rows.length > 1 && isSep(rows[1]);
    rows.forEach(function (r, idx) {
      if (isSep(r)) return;
      var tag = (hasHeader && idx === 0) ? 'th' : 'td';
      var cells = r.replace(/^\s*\|/, '').replace(/\|\s*$/, '').split('|');
      html += '<tr>' + cells.map(function (c) {
        return '<' + tag + '>' + inline(c.trim()) + '</' + tag + '>';
      }).join('') + '</tr>';
    });
    return html + '</table></div>';
  }

  function parseBlocks(lines) {
    var out = '', i = 0;
    while (i < lines.length) {
      var l = lines[i];

      if (/^```/.test(l)) {
        var cls = l.slice(3).trim(), buf = [];
        i++;
        while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
        i++;
        out += renderTerm(buf, cls);
      } else if (/^:::html/.test(l)) {
        var r = collect(lines, i);
        out += r[0].join('\n');
        i = r[1];
      } else if (/^:::cols/.test(l)) {
        var rc = collect(lines, i);
        i = rc[1];
        out += '<div class="cols">' + splitCols(rc[0]).map(function (col) {
          return '<div>' + parseBlocks(col) + '</div>';
        }).join('') + '</div>';
      } else if (/^:::card/.test(l)) {
        var head = l.slice(7).trim(), hcls = '';
        var m = head.match(/^!(\w+)\s+/);
        if (m) { hcls = ' class="' + m[1] + '"'; head = head.slice(m[0].length); }
        var rk = collect(lines, i);
        i = rk[1];
        out += '<div class="card"><h3' + hcls + '>' + inline(head) + '</h3>' + parseBlocks(rk[0]) + '</div>';
      } else if (/^>\s/.test(l)) {
        var gb = [];
        while (i < lines.length && /^>/.test(lines[i])) gb.push(lines[i++].replace(/^>\s?/, ''));
        out += '<div class="gotcha"><span class="tag">' + inline(gb[0]) + '</span><p>' +
          inline(gb.slice(1).join(' ')) + '</p></div>';
      } else if (/^\|/.test(l)) {
        var tb = [];
        while (i < lines.length && /^\|/.test(lines[i])) tb.push(lines[i++]);
        out += renderTable(tb);
      } else if (/^- /.test(l)) {
        var li = [];
        while (i < lines.length && /^- /.test(lines[i])) li.push(lines[i++].slice(2));
        out += '<ul>' + li.map(function (x) { return '<li>' + inline(x) + '</li>'; }).join('') + '</ul>';
      } else if (/^### /.test(l)) {
        out += '<h3>' + inline(l.slice(4)) + '</h3>';
        i++;
      } else if (/^~\s/.test(l)) {
        out += '<p class="muted">' + inline(l.replace(/^~\s/, '')) + '</p>';
        i++;
      } else if (l.trim() === '') {
        i++;
      } else {
        var pb = [];
        while (i < lines.length && lines[i].trim() !== '' && !/^(```|:::|[->~#|]|## )/.test(lines[i])) {
          pb.push(lines[i++]);
        }
        if (pb.length === 0) { i++; continue; }
        out += '<p>' + inline(pb.join(' ')) + '</p>';
      }
    }
    return out;
  }

  function renderSlide(txt) {
    var lines = txt.split('\n');
    var section = '', title = '', hero = false, demo = '', eyebrow = null;
    var rest = [];
    lines.forEach(function (l) {
      if (/^## /.test(l) && !title) {
        var h = l.slice(3), p = h.indexOf('|');
        section = h.slice(0, p).trim();
        title = h.slice(p + 1).trim();
      } else if (/^@hero\s*$/.test(l)) hero = true;
      else if (/^@demo /.test(l)) demo = l.slice(6).trim();
      else if (/^@eyebrow /.test(l)) eyebrow = l.slice(9).trim();
      else rest.push(l);
    });
    var body = parseBlocks(rest);
    var inner;
    if (demo) {
      inner = '<div class="demo-badge">' + esc(demo) + '</div><h2>' + inline(title) + '</h2>' + body;
    } else if (hero) {
      inner = '<div class="hero">' +
        (eyebrow ? '<div class="eyebrow">' + inline(eyebrow) + '</div>' : '') +
        '<h1>' + inline(title) + '</h1>' + body + '</div>';
    } else {
      inner = '<div class="eyebrow">' + inline(eyebrow || section) + '</div><h2>' + inline(title) + '</h2>' + body;
    }
    var sec = document.createElement('section');
    sec.className = 'slide' + (demo ? ' demo-slide' : '');
    sec.dataset.section = section;
    sec.innerHTML = inner;
    return sec;
  }

  // split the deck source into slides on standalone "---" lines (outside fences)
  var raw = document.getElementById('deck').textContent;
  var parts = [], cur = [], fence = false;
  raw.split('\n').forEach(function (l) {
    if (/^```/.test(l)) fence = !fence;
    if (l.trim() === '---' && !fence) { parts.push(cur.join('\n')); cur = []; }
    else cur.push(l);
  });
  parts.push(cur.join('\n'));

  var hud = document.getElementById('hud');
  var slides = parts
    .filter(function (p) { return p.trim() !== ''; })
    .map(function (p) {
      var sec = renderSlide(p);
      document.body.insertBefore(sec, hud);
      return sec;
    });

  var counter = document.getElementById('counter');
  var label = document.getElementById('section-label');
  var bar = document.getElementById('bar');
  var i = 0;

  function show(n) {
    i = Math.max(0, Math.min(slides.length - 1, n));
    slides.forEach(function (s, k) { s.classList.toggle('active', k === i); });
    counter.textContent = (i + 1) + ' / ' + slides.length;
    label.textContent = slides[i].dataset.section || 'Docker Compose for the Team';
    bar.style.width = ((i + 1) / slides.length * 100) + '%';
    try { history.replaceState(null, '', '#' + (i + 1)); } catch (e) {}
  }

  var lastNav = 0;
  function step(delta) {
    // Key auto-repeat and double-fired events arrive within a few ms of the
    // original press; one deliberate keystroke = one slide.
    var now = Date.now();
    if (now - lastNav < 120) return;
    lastNav = now;
    show(i + delta);
  }

  document.addEventListener('keydown', function (e) {
    if (e.repeat || e.metaKey || e.ctrlKey || e.altKey) return;
    if (['ArrowRight', 'ArrowDown', ' ', 'PageDown'].indexOf(e.key) !== -1) { e.preventDefault(); step(1); }
    else if (['ArrowLeft', 'ArrowUp', 'PageUp'].indexOf(e.key) !== -1) { e.preventDefault(); step(-1); }
    else if (e.key === 'Home') show(0);
    else if (e.key === 'End') show(slides.length - 1);
  });
  var fromHash = parseInt(location.hash.slice(1), 10);
  show(isNaN(fromHash) ? 0 : fromHash - 1);
})();
</script>
